<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Card</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Flash Cards de tecnologia</h1>
    <p>Clique em um card para ver a resposta. Clique novamente para voltar.</p>

    <div class="cards">
        <!-- cartão 1 -->
        <label class="card">
        <input type="checkbox">
        <div class="card_interno">
            <div class="frente">
                <h2>Pergunta 1</h2>
                <p>O que é Hardware?</p>
            </div>
            
            <div class="verso">
                <h2>Resposta</h2>
                <p>É a parte física do computador, como teclado ou monitor.</p>
            </div>
        </div>  
        </label>
    <!-- cartão 2 -->
    <label class="card">
        <input type="checkbox">
        <div class="card_interno">
            <div class="frente">
                <h2>Pergunta 2</h2>
                <p>O que é Software?</p>
            </div>
            <div class="verso">
                <h2>Resposta</h2>
                <p>É um programa ou conjunto de programas ultilizados pelo computador.</p>
            </div>
        </div>  
        </label>
    <!-- cartão 3 -->
        <label class="card">
        <input type="checkbox">
        <div class="card_interno">
            <div class="frente">
                <h2>Pergunta 3</h2>
                <p>O que é Internet?</p>
            </div>
            <div class="verso">
                <h2>Resposta</h2>
                <p>É uma rede mundial que conecta computadores e outros dispositivos.</p>
            </div>
      </div>  
    </label>
    <!-- cartão 4 -->
    <label class="card">
        <input type="checkbox">
        <div class="card_interno">
            <div class="frente">
                <h2>Pergunta 4</h2>
                <p>O que é Inteligência Artificial?</p>
            </div>
        <div class="verso">
            <h2>Resposta</h2>
            <p>É uma tecnologia que permite aos computadores realizar tarefas que simulam capacidades humanas.</p>
        </div>
      </div>  
    </label>
        
    </div>
</body>
</html>
